<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dispatch Dashboard</title>

<style>

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Inter, sans-serif;
}

/* BACKGROUND */
body {
  background: url('background.png') center/cover no-repeat fixed;
  position: relative;
  color: #fff;
  overflow: hidden;
}

/* DARK OVERLAY BEHIND EVERYTHING */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(2px);
  z-index: -10;
}

/* GLASS PANELS — MORE TRANSPARENT */
.glass {
  background: rgba(255,255,255,0.14); /* MORE SEE-THROUGH */
  backdrop-filter: blur(22px);
  border: 1px solid rgba(255,255,255,0.20);
  border-radius: 22px;
  box-shadow: 0 6px 28px rgba(0,0,0,0.28);
  z-index: 20;
}

/* SIDEBAR */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: 240px;
  height: 100vh;
  padding: 24px;
  display: flex;
  flex-direction: column;
}
.sidebar h2 {
  font-size: 22px;
  margin-bottom: 30px;
}
.sidebar a {
  color: #fff;
  text-decoration: none;
  opacity: 0.85;
  margin-bottom: 18px;
  font-size: 16px;
  cursor: pointer;
}
.sidebar a:hover {
  opacity: 1;
}

/* TOP BAR */
.topbar {
  position: fixed;
  top: 0;
  left: 240px;
  right: 0;
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 0 24px;
  font-size: 18px;
}

/* MAIN PANEL — ONLY ONE AT A TIME */
.main-panel {
  position: absolute;
  top: 90px;
  left: 260px;
  right: 20px;
  bottom: 20px;
  padding: 24px;
  z-index: 30;
  overflow: hidden;
}

/* MAP CONTAINER */
#map {
  width: 100%;
  height: 100%;
  border-radius: 22px;
}

/* HIDDEN PANELS */
.hidden {
  display: none;
}

</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar glass">
  <h2>Dispatch</h2>

  <a onclick="showPanel('map-panel')">Map</a>
  <a onclick="showPanel('active-panel')">Active Jobs</a>
  <a onclick="showPanel('pending-panel')">Pending Jobs</a>
  <a onclick="showPanel('completed-panel')">Completed Jobs</a>
  <a onclick="showPanel('tech-panel')">Technicians</a>
  <a onclick="showPanel('settings-panel')">Settings</a>
</div>

<!-- TOP BAR WITH TIME + DATE -->
<div class="topbar glass">
  <span id="datetime"></span>
</div>

<!-- MAIN PANEL (ONLY ONE VISIBLE AT A TIME) -->
<div class="main-panel glass">

  <!-- MAP PANEL -->
  <div id="map-panel">
    <div id="map"></div>
  </div>

  <!-- ACTIVE JOBS -->
  <div id="active-panel" class="hidden">
    <h2>Active Jobs</h2>
    <div id="jobs-list"></div>
  </div>

  <!-- PENDING JOBS -->
  <div id="pending-panel" class="hidden">
    <h2>Pending Jobs</h2>
    <div id="pending-list"></div>
  </div>

  <!-- COMPLETED JOBS -->
  <div id="completed-panel" class="hidden">
    <h2>Completed Jobs</h2>
    <div id="completed-list"></div>
  </div>

  <!-- TECHNICIANS -->
  <div id="tech-panel" class="hidden">
    <h2>Technicians</h2>
    <div id="tech-list"></div>
  </div>

  <!-- SETTINGS -->
  <div id="settings-panel" class="hidden">
    <h2>Settings</h2>
  </div>

</div>

</body>
</html>
<script>

// LOCAL VARIABLES
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
const MAPBOX_TOKEN = "YOUR_MAPBOX_TOKEN";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
mapboxgl.accessToken = MAPBOX_TOKEN;

/* TIME + DATE */
function updateDateTime() {
  const now = new Date();
  document.getElementById("datetime").innerText =
    now.toLocaleDateString() + " • " + now.toLocaleTimeString();
}
setInterval(updateDateTime, 1000);
updateDateTime();

/* PANEL SWITCHING */
function showPanel(panelId) {
  const panels = [
    "map-panel",
    "active-panel",
    "pending-panel",
    "completed-panel",
    "tech-panel",
    "settings-panel"
  ];
  panels.forEach(id => {
    document.getElementById(id).classList.add("hidden");
  });
  document.getElementById(panelId).classList.remove("hidden");
}

/* MAP */
let map;
function loadMap() {
  map = new mapboxgl.Map({
    container: "map",
    style: "mapbox://styles/mapbox/streets-v11",
    center: [-84.56, 39.92], // Springfield OH
    zoom: 11
  });
}
loadMap();

/* LOAD JOBS */
async function loadJobs() {
  const { data } = await supabaseClient.from("jobs").select("*");
  const active = document.getElementById("jobs-list");
  const pending = document.getElementById("pending-list");
  const completed = document.getElementById("completed-list");

  active.innerHTML = "";
  pending.innerHTML = "";
  completed.innerHTML = "";

  data.forEach(job => {
    const div = document.createElement("div");
    div.innerHTML = `<p><strong>${job.title}</strong> — ${job.status}</p>`;

    if (job.status === "active") active.appendChild(div);
    if (job.status === "pending") pending.appendChild(div);
    if (job.status === "completed") completed.appendChild(div);
  });
}

/* LOAD TECHS */
async function loadTechs() {
  const { data } = await supabaseClient.from("technicians").select("*");
  const container = document.getElementById("tech-list");
  container.innerHTML = "";
  data.forEach(tech => {
    const div = document.createElement("div");
    div.innerHTML = `<p><strong>${tech.name}</strong> — ${tech.status}</p>`;
    container.appendChild(div);
  });
}

/* INITIAL LOAD */
loadJobs();
loadTechs();

</script>
