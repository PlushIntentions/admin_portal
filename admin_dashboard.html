<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dispatch Dashboard</title>

<style>

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Inter, sans-serif;
}

/* BACKGROUND */
body {
  background: url('background.png') center/cover no-repeat fixed;
  position: relative;
  color: #fff;
  overflow: hidden;
}

/* DARK OVERLAY */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(2px);
  z-index: -10;
}

/* GLASS STYLE — MORE SEE THROUGH */
.glass {
  background: rgba(255,255,255,0.12); /* MORE TRANSPARENT */
  backdrop-filter: blur(22px);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 22px;
  box-shadow: 0 6px 28px rgba(0,0,0,0.28);
}

/* SIDEBAR */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: 240px;
  height: 100vh;
  padding: 24px;
  display: flex;
  flex-direction: column;
  z-index: 20;
}
.sidebar h2 {
  font-size: 22px;
  margin-bottom: 30px;
}
.sidebar a {
  color: #fff;
  text-decoration: none;
  opacity: 0.85;
  margin-bottom: 18px;
  font-size: 16px;
  cursor: pointer;
}
.sidebar a:hover {
  opacity: 1;
}

/* TOP BAR */
.topbar {
  position: fixed;
  top: 0;
  left: 240px;
  right: 0;
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 0 24px;
  font-size: 18px;
  z-index: 20;
}

/* MAIN PANEL — FULL SCREEN */
.main-panel {
  position: fixed;
  top: 90px;
  left: 260px;
  right: 20px;
  bottom: 20px;
  padding: 24px;
  z-index: 30;
  overflow: hidden;
}

/* MAP PANEL — SMALL PANEL INSIDE MAIN */
#map-panel {
  width: 100%;
  height: 300px; /* EXACT SIZE LIKE YOUR PHOTO */
  margin-bottom: 20px;
  border-radius: 22px;
  overflow: hidden;
}

/* MAP ITSELF */
#map {
  width: 100%;
  height: 100%;
}

/* CONTENT PANEL BELOW MAP */
#content-panel {
  width: 100%;
  height: calc(100% - 320px);
  border-radius: 22px;
  padding: 20px;
  overflow-y: auto;
}

.hidden {
  display: none;
}

</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar glass">
  <h2>Dispatch</h2>

  <a onclick="showPanel('map')">Map</a>
  <a onclick="showPanel('active')">Active Jobs</a>
  <a onclick="showPanel('pending')">Pending Jobs</a>
  <a onclick="showPanel('completed')">Completed Jobs</a>
  <a onclick="showPanel('techs')">Technicians</a>
  <a onclick="showPanel('settings')">Settings</a>
</div>

<!-- TOP BAR -->
<div class="topbar glass">
  <span id="datetime"></span>
</div>

<!-- MAIN PANEL -->
<div class="main-panel glass">

  <!-- MAP PANEL (SMALL PANEL AT TOP) -->
  <div id="map-panel" class="glass">
    <div id="map"></div>
  </div>

  <!-- CONTENT PANEL BELOW MAP -->
  <div id="content-panel" class="glass">
    <div id="active" class="panel">Active Jobs</div>
    <div id="pending" class="panel hidden">Pending Jobs</div>
    <div id="completed" class="panel hidden">Completed Jobs</div>
    <div id="techs" class="panel hidden">Technicians</div>
    <div id="settings" class="panel hidden">Settings</div>
  </div>

</div>

</body>
</html>

/* TIME + DATE */
function updateDateTime() {
  const now = new Date();
  document.getElementById("datetime").innerText =

/* PANEL SWITCHING */
function showPanel(panel) {
  const panels = ["active", "pending", "completed", "techs", "settings"];
  panels.forEach(id => {
    document.getElementById(id).classList.add("hidden");
  });
  document.getElementById(panel).classList.remove("hidden");
}

/* MAP LOADS IMMEDIATELY */
