<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dispatch Dashboard</title>

<style>

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Inter, sans-serif;
}

/* FULLSCREEN BACKGROUND PHOTO */
body {
  background: url('background.png') center/cover no-repeat fixed;
  position: relative;
  color: #fff;
  overflow: hidden;
}

/* DARK OVERLAY */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(2px);
  z-index: -1;
}

/* UNIVERSAL GLASS PANEL STYLE */
.sidebar,
.topbar,
.card,
.modal,
.assign-modal {
  background: rgba(255,255,255,0.22); /* updated opacity */
  backdrop-filter: blur(22px);
  border: 1px solid rgba(255,255,255,0.28);
  border-radius: 22px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.35);
}

/* SIDEBAR */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: 240px;
  height: 100vh;
  padding: 24px;
  display: flex;
  flex-direction: column;
  z-index: 20;
}

.sidebar h2 {
  font-size: 22px;
  margin-bottom: 30px;
}

.sidebar a {
  color: #fff;
  text-decoration: none;
  opacity: 0.85;
  margin-bottom: 18px;
  font-size: 16px;
}

.sidebar a:hover {
  opacity: 1;
}

/* TOP BAR */
.topbar {
  position: fixed;
  top: 0;
  left: 240px;
  right: 0;
  height: 70px;
  display: flex;
  align-items: center;
  padding: 0 24px;
  z-index: 19;
}

.topbar h1 {
  font-size: 22px;
  font-weight: 600;
}

/* MAIN CONTENT */
.main {
  position: absolute;
  top: 70px;
  left: 240px;
  right: 0;
  bottom: 0;
  padding: 24px;
  overflow-y: auto;
}

/* CARDS */
.card {
  padding: 22px;
  margin-bottom: 20px;
}

/* MODAL OVERLAY */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(4px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
  z-index: 200;
}

.modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

/* JOB DETAILS MODAL */
.modal {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 1000px;
  max-width: 95%;
  max-height: 90vh;
  transform: translate(-50%, -50%) scale(0.92);
  padding: 28px;
  overflow-y: auto;
  opacity: 0;
  transition: all 0.25s ease;
  z-index: 201;
}

.modal.active {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

/* CLOSE BUTTON */
.modal-close {
  position: absolute;
  top: 18px;
  right: 18px;
  font-size: 22px;
  cursor: pointer;
  opacity: 0.8;
}

.modal-close:hover {
  opacity: 1;
}

/* TIMELINE */
.timeline {
  margin: 20px 0;
  padding-left: 10px;
  border-left: 2px solid rgba(255,255,255,0.25);
}

.timeline-item {
  margin-bottom: 16px;
  padding-left: 14px;
  position: relative;
}

.timeline-item::before {
  content: "";
  position: absolute;
  left: -10px;
  top: 4px;
  width: 10px;
  height: 10px;
  background: #00eaff;
  border-radius: 50%;
}

/* ACTIVITY FEED */
.activity-feed {
  margin-top: 20px;
  max-height: 260px;
  overflow-y: auto;
  padding-right: 10px;
}

.activity-item {
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(12px);
  border-radius: 16px;
  padding: 14px 18px;
  margin-bottom: 12px;
  border: 1px solid rgba(255,255,255,0.25);
  opacity: 0;
  transform: translateY(10px);
  animation: fadeInUp 0.35s forwards;
}

.activity-item h4 {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
}

.activity-item p {
  margin: 4px 0 0 0;
  opacity: 0.85;
  font-size: 14px;
}

@keyframes fadeInUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ASSIGN TECH MODAL */
.assign-modal {
  position: fixed;
  top: 50%;
  left: 50%;
  width: 600px;
  max-width: 95%;
  max-height: 80vh;
  transform: translate(-50%, -50%) scale(0.92);
  padding: 24px;
  overflow-y: auto;
  opacity: 0;
  transition: all 0.25s ease;
  z-index: 202;
}

.assign-modal.active {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

</style>
</head>
<body>

<div class="sidebar">
  <h2>Dispatch</h2>
  <a href="#">Dashboard</a>
  <a href="#">Jobs</a>
  <a href="#">Technicians</a>
  <a href="#">Settings</a>
</div>

<div class="topbar">
  <h1>Dashboard</h1>
</div>

<div class="main">

  <div class="card">
    <h2>Active Jobs</h2>
    <div id="jobs-list"></div>
  </div>

  <div class="card">
    <h2>Technicians</h2>
    <div id="tech-list"></div>
  </div>

</div>

<div id="modal-overlay" class="modal-overlay"></div>

<div id="job-modal" class="modal">
  <div class="modal-close" onclick="closeJobModal()">✕</div>

  <h2 id="job-title">Job Details</h2>

  <div id="job-info"></div>

  <h3>Status Timeline</h3>
  <div id="timeline" class="timeline"></div>

  <h3>Activity Feed</h3>
  <div id="activity-feed" class="activity-feed"></div>

  <h3>Technician</h3>
  <div id="assigned-tech"></div>

  <button onclick="openAssignModal()" style="margin-top:20px;padding:10px 16px;border-radius:10px;border:none;background:#00eaff;color:#000;font-weight:600;cursor:pointer;">
    Assign Technician
  </button>

</div>

<div id="assign-modal" class="assign-modal">
  <div class="modal-close" onclick="closeAssignModal()">✕</div>

  <h2>Assign Technician</h2>

  <div id="assign-tech-list"></div>

</div>

</body>
</html>
<script>

const SUPABASE_URL = window.NEXT_PUBLIC_SUPABASE_URL;
const SUPABASE_ANON_KEY = window.NEXT_PUBLIC_SUPABASE_ANON_KEY;
const MAPBOX_TOKEN = window.NEXT_PUBLIC_MAPBOX_TOKEN;

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
mapboxgl.accessToken = MAPBOX_TOKEN;

let currentJobId = null;

/* LOAD JOBS */
async function loadJobs() {
  const { data } = await supabaseClient.from("jobs").select("*").order("created_at", { ascending: false });
  const container = document.getElementById("jobs-list");
  container.innerHTML = "";
  data.forEach(job => {
    const div = document.createElement("div");
    div.className = "card";
    div.style.cursor = "pointer";
    div.innerHTML = `<h3>${job.title}</h3><p>${job.address}</p><p>Status: ${job.status}</p>`;
    div.onclick = () => openJobModal(job.id);
    container.appendChild(div);
  });
}

/* LOAD TECHS */
async function loadTechs() {
  const { data } = await supabaseClient.from("technicians").select("*");
  const container = document.getElementById("tech-list");
  container.innerHTML = "";
  data.forEach(tech => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `<h3>${tech.name}</h3><p>${tech.status}</p>`;
    container.appendChild(div);
  });
}

/* OPEN JOB MODAL */
async function openJobModal(jobId) {
  currentJobId = jobId;
  document.getElementById("modal-overlay").classList.add("active");
  document.getElementById("job-modal").classList.add("active");
  loadJobDetails(jobId);
  loadTimeline(jobId);
  loadActivity(jobId);
  loadAssignedTech(jobId);
}

/* CLOSE JOB MODAL */
function closeJobModal() {
  document.getElementById("modal-overlay").classList.remove("active");
  document.getElementById("job-modal").classList.remove("active");
}

/* JOB DETAILS */
async function loadJobDetails(jobId) {
  const { data } = await supabaseClient.from("jobs").select("*").eq("id", jobId).single();
  document.getElementById("job-title").innerText = data.title;
  document.getElementById("job-info").innerHTML = `
    <p><strong>Address:</strong> ${data.address}</p>
    <p><strong>Status:</strong> ${data.status}</p>
    <p><strong>Description:</strong> ${data.description || "None"}</p>
  `;
}

/* TIMELINE */
async function loadTimeline(jobId) {
  const { data } = await supabaseClient.from("job_timeline").select("*").eq("job_id", jobId).order("created_at", { ascending: true });
  const container = document.getElementById("timeline");
  container.innerHTML = "";
  data.forEach(item => {
    const div = document.createElement("div");
    div.className = "timeline-item";
    div.innerHTML = `<strong>${item.status}</strong><br><span style="opacity:0.7">${new Date(item.created_at).toLocaleString()}</span>`;
    container.appendChild(div);
  });
}

/* ACTIVITY FEED */
async function loadActivity(jobId) {
  const { data } = await supabaseClient.from("job_activity").select("*").eq("job_id", jobId).order("created_at", { ascending: false });
  const container = document.getElementById("activity-feed");
  container.innerHTML = "";
  data.forEach(item => {
    const div = document.createElement("div");
    div.className = "activity-item";
    div.innerHTML = `
      <h4>${item.title}</h4>
      <p>${item.details}</p>
      <p style="opacity:0.6;font-size:12px;margin-top:6px;">${new Date(item.created_at).toLocaleString()}</p>
    `;
    container.appendChild(div);
  });
}

/* ASSIGNED TECH */
async function loadAssignedTech(jobId) {
  const { data } = await supabaseClient.from("jobs").select("assigned_tech, technicians(name)").eq("id", jobId).single();
  const container = document.getElementById("assigned-tech");
  if (!data.assigned_tech) {
    container.innerHTML = `<p>No technician assigned.</p>`;
    return;
  }
  container.innerHTML = `<p><strong>Assigned Technician:</strong> ${data.technicians.name}</p>`;
}

/* OPEN ASSIGN MODAL */
async function openAssignModal() {
  document.getElementById("assign-modal").classList.add("active");
  const { data } = await supabaseClient.from("technicians").select("*");
  const container = document.getElementById("assign-tech-list");
  container.innerHTML = "";
  data.forEach(tech => {
    const div = document.createElement("div");
    div.className = "card";
    div.style.cursor = "pointer";
    div.innerHTML = `<h3>${tech.name}</h3><p>Status: ${tech.status}</p>`;
    div.onclick = () => assignTech(tech.id);
    container.appendChild(div);
  });
}

/* CLOSE ASSIGN MODAL */
function closeAssignModal() {
  document.getElementById("assign-modal").classList.remove("active");
}

/* ASSIGN TECH */
async function assignTech(techId) {
  if (!currentJobId) return;
  await supabaseClient.from("jobs").update({ assigned_tech: techId }).eq("id", currentJobId);
  closeAssignModal();
  loadAssignedTech(currentJobId);
}

/* REAL-TIME SUBSCRIPTIONS */
supabaseClient.channel("jobs-changes")
  .on("postgres_changes", { event: "*", schema: "public", table: "jobs" }, payload => {
    loadJobs();
    if (payload.new.id === currentJobId) {
      loadJobDetails(currentJobId);
      loadAssignedTech(currentJobId);
    }
  })
  .subscribe();

supabaseClient.channel("timeline-changes")
  .on("postgres_changes", { event: "*", schema: "public", table: "job_timeline" }, payload => {
    if (payload.new.job_id === currentJobId) loadTimeline(currentJobId);
  })
  .subscribe();

supabaseClient.channel("activity-changes")
  .on("postgres_changes", { event: "*", schema: "public", table: "job_activity" }, payload => {
    if (payload.new.job_id === currentJobId) loadActivity(currentJobId);
  })
  .subscribe();

/* INITIAL LOAD */
loadJobs();
loadTechs();

</script>
