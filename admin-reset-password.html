<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create New Password – Plush Intentions</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Inter, sans-serif;
      background: #0F0F0F;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      background: #1A1A1A;
      padding: 40px;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 20px rgba(245, 193, 92, 0.15);
    }

    h2 {
      font-family: "Playfair Display", serif;
      margin-bottom: 20px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #2A2A2A;
      color: white;
      font-size: 14px;
      margin-top: 10px;
    }

    button {
      margin-top: 25px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #E8A7C8, #F5C15C);
      color: #0F0F0F;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .error { color: #FF7C7C; }
    .success { color: #7CFF9E; }
  </style>
</head>

<body>

<div class="card">
  <h2>Create a New Password</h2>

  <input id="newPassword" type="password" placeholder="New Password">
  <input id="confirmPassword" type="password" placeholder="Confirm Password">

  <button onclick="updatePassword()">Update Password</button>

  <p id="msg" class="message"></p>
</div>

<script>
  const supabaseClient = supabase.createClient(
    "https://gsneugdwoxpibajghwge.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdzbmV1Z2R3b3hwaWJhamdod2dlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyNjk2NjUsImV4cCI6MjA5Mzg0NTY2NX0.wmZDgY_fAfeiDlZzWLA4KT5_dlbyG7Ns1W4z_HZH8Ws"
  );

  async function updatePassword() {
    const msg = document.getElementById("msg");
    msg.textContent = "";

    const newPass = document.getElementById("newPassword").value.trim();
    const confirmPass = document.getElementById("confirmPassword").value.trim();

    if (newPass !== confirmPass) {
      msg.textContent = "Passwords do not match.";
      msg.className = "message error";
      return;
    }

    const { data, error } = await supabaseClient.auth.updateUser({
      password: newPass
    });

    if (error) {
      msg.textContent = error.message;
      msg.className = "message error";
    } else {
      msg.textContent = "Password updated successfully!";
      msg.className = "message success";
      setTimeout(() => {
        window.location.href = "admin-login.html";
      }, 1500);
    }
  }
</script>

</body>
</html>
